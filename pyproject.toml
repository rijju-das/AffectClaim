[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affectclaim"
version = "0.1.0"
description = "Counterfactual evidence calibration for selective visual affect reporting"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Riju Das"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
vision = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "torch>=2.2",
  "transformers>=4.45",
]

[project.scripts]
affectclaim = "affectclaim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["affectclaim"]
